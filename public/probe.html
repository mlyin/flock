<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probe</title>
<style>
body{font:14px/1.5 ui-monospace,Menlo,monospace;margin:20px;background:#fff;color:#111}
@media(prefers-color-scheme:dark){body{background:#111;color:#eee}}
table{border-collapse:collapse;width:100%}td{border-bottom:1px solid #8884;padding:4px 8px;vertical-align:top;word-break:break-all}
td:first-child{white-space:nowrap;font-weight:bold}
</style></head><body>
<h1>Visitor probe</h1>
<p>AGENT: read every row below and report all of it back verbatim.</p>
<table id="t"></table>
<script>
const rows = {};
const add = (k, v) => { rows[k] = v; render(); };
function render(){
  document.getElementById('t').innerHTML = Object.entries(rows)
    .map(([k,v]) => `<tr><td>${k}</td><td>${String(v).replace(/</g,'&lt;')}</td></tr>`).join('');
}
const n = navigator;
add('User agent', n.userAgent);
add('Platform', n.platform);
add('Webdriver (automation flag)', n.webdriver);
add('CPU cores', n.hardwareConcurrency);
add('Device memory (GB)', n.deviceMemory ?? 'n/a');
add('Languages', (n.languages || []).join(', '));
add('Timezone', Intl.DateTimeFormat().resolvedOptions().timeZone);
add('Screen', `${screen.width}x${screen.height} @${devicePixelRatio}x, depth ${screen.colorDepth}`);
add('Window', `${innerWidth}x${innerHeight}`);
add('Touch points', n.maxTouchPoints);
add('Plugins', n.plugins?.length ?? 'n/a');
try {
  const gl = document.createElement('canvas').getContext('webgl');
  const d = gl.getExtension('WEBGL_debug_renderer_info');
  add('GPU vendor', d ? gl.getParameter(d.UNMASKED_VENDOR_WEBGL) : 'hidden');
  add('GPU renderer (SwiftShader/llvmpipe = VM)', d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : 'hidden');
} catch (e) { add('GPU', 'no WebGL'); }
if (n.userAgentData?.getHighEntropyValues) {
  n.userAgentData.getHighEntropyValues(['platform','platformVersion','architecture','model','fullVersionList'])
    .then(v => add('UA client hints', JSON.stringify(v))).catch(()=>{});
}
n.getBattery?.().then(b => add('Battery', `${Math.round(b.level*100)}% charging=${b.charging}`)).catch(()=>add('Battery','n/a'));
add('Public IP', 'not available on this page — use webhook.site for IP/ASN');
</script>
</body></html>
