name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Money-math simulation
        # 400 synthetic garments through the fee engine on every push. This is
        # the sweep that caught the Vestiaire floor/cap solver bug — it stays.
        run: npm run simulate
      - name: Build
        # Dummy env: middleware no-ops without real Supabase config and every
        # page is dynamic, so the build only needs the vars to EXIST.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
        run: npm run build
