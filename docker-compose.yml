# One-box Flock. Secrets come from .env on the host (same names as
# .env.example) — never baked into the image. Supabase stays managed; the box
# runs only the app, which is what keeps this a 30-minute setup instead of a
# database-operations career.
services:
  flock:
    image: ghcr.io/mlyin/threader:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    env_file: .env
    ports:
      - "127.0.0.1:3737:3737"   # reverse proxy (Caddy/nginx) terminates TLS in front
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3737/login"]
      interval: 30s
      timeout: 5s
      retries: 3
