workflows:
  flock-ios:
    name: Flock App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      node: 24
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sellonflock.app
      vars:
        EXPO_NO_TELEMETRY: '1'
        CI: '1'
    scripts:
      - name: Install and verify JavaScript
        script: |
          cd mobile
          npm ci
          node --test src/model.check.cjs
          npx expo export --platform ios
      - name: Generate native workspace
        script: |
          cd mobile
          node -e 'const fs=require("fs");const p="app.json";const c=JSON.parse(fs.readFileSync(p));c.expo.ios.buildNumber=String(Number(process.env.PROJECT_BUILD_NUMBER)+100);fs.writeFileSync(p,JSON.stringify(c,null,2));'
          npx expo prebuild --platform ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Archive and export
        script: |
          xcode-project build-ipa --workspace mobile/ios/Flock.xcworkspace --scheme Flock
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
