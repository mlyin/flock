<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        font: 13.5px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      h1 { font-size: 15px; margin: 0 0 3px; letter-spacing: -.01em; }
      .sub { font-size: 11.5px; opacity: .6; margin: 0 0 14px; }
      input {
        width: 100%; box-sizing: border-box; padding: 8px 10px;
        font: inherit; font-family: ui-monospace, Consolas, monospace;
        border: 1px solid rgba(128,128,128,.4); border-radius: 4px;
        background: Field; color: FieldText;
      }
      button {
        font: inherit; padding: 8px 12px; border-radius: 4px; cursor: pointer;
        border: 1px solid rgba(128,128,128,.4); background: ButtonFace; color: ButtonText;
      }
      button.primary { background: #3A5570; color: #fff; border-color: #3A5570; }
      button:disabled { opacity: .5; cursor: default; }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      .item {
        display: flex; justify-content: space-between; align-items: center; gap: 10px;
        padding: 10px 0; border-top: 1px solid rgba(128,128,128,.22);
      }
      .item-name { font-weight: 600; }
      .item-meta { font-size: 11.5px; opacity: .65; font-family: ui-monospace, Consolas, monospace; }
      .msg { font-size: 12px; padding: 9px 11px; border-radius: 4px; margin-top: 10px; }
      .msg-bad { background: rgba(158,61,46,.14); color: #C4604F; }
      .msg-ok { background: rgba(78,107,73,.14); color: #6E9166; }
      .empty { font-size: 12.5px; opacity: .65; padding: 14px 0; }
      .opts {
        display: flex; flex-direction: column; gap: 7px;
        padding: 10px 12px; margin-bottom: 12px; border-radius: 4px;
        background: rgba(128,128,128,.1); font-size: 12px;
      }
      .opts label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
      .opts input { width: auto; margin: 2px 0 0; }
      a { color: #6E9DC9; }
    </style>
  </head>
  <body>
    <h1>Flock</h1>
    <p class="sub">Fills your sell forms. You submit.</p>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
